upstream campusflow_api {
    server campusflow-api:8000;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html/campusflow;
    index index.html;
    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location /api/ {
        proxy_pass http://campusflow_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://campusflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name tiendamgr.duckdns.org;

    root /usr/share/nginx/html/tiendamgr;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/tiendamgr.duckdns.org/tiendamgr.duckdns.org.crt;
    ssl_certificate_key /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/tiendamgr.duckdns.org/tiendamgr.duckdns.org.key;

    root /usr/share/nginx/html/campusflow;
    index index.html;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://campusflow_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://campusflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name tiendamgr.duckdns.org;

    ssl_certificate /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/tiendamgr.duckdns.org/tiendamgr.duckdns.org.crt;
    ssl_certificate_key /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/tiendamgr.duckdns.org/tiendamgr.duckdns.org.key;

    root /usr/share/nginx/html/tiendamgr;
    index index.html;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
