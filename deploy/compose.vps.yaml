services:
  api:
    build:
      context: /srv/proyectos/CampusFlow
      dockerfile: Dockerfile
    image: campusflow-api:refactor
    container_name: campusflow-api
    restart: unless-stopped
    env_file:
      - /srv/proyectos/CampusFlow/.env
    environment:
      UPLOADS_DIR: /app/uploads
    expose:
      - "8000"
    volumes:
      - campusflow_uploads:/app/uploads
    networks:
      - entrada_web

  nginx:
    image: nginx:alpine
    container_name: campusflow-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - /srv/proyectos/ProxyNginx/nginx-campusflow.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/proyectos/ProxyNginx/acme:/var/www/certbot:ro
      - /srv/proyectos/TiendaMGR/public:/usr/share/nginx/html/tiendamgr:ro
      - /srv/proyectos/CampusFlow/frontend/dist:/usr/share/nginx/html/campusflow:ro
      - tiendamgr_caddy_data:/caddy-data:ro
    networks:
      - entrada_web

volumes:
  campusflow_uploads:
  tiendamgr_caddy_data:
    external: true
    name: tiendamgr_caddy_data

networks:
  entrada_web:
    external: true
