name: Validar aplicacion

on:
  push:
    branches: [main, refactor]
  pull_request:
    branches: [main, refactor]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./campusflow-test.db
      SECRET_KEY: clave-de-prueba-ci-segura-con-32-caracteres-minimo
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      COOKIE_SECURE: "false"

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de Python
        run: python -m pip install -r requirements-dev.txt

      - name: Ejecutar pruebas del backend
        run: python -m pytest -q

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Revisar tipos y compilar frontend
        working-directory: frontend
        run: npm run build

      - name: Ejecutar pruebas del frontend
        working-directory: frontend
        run: npm test
